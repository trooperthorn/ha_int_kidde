blueprint:
  name: Kidde BLE Protocol Capture
  description: >-
    Records a diagnostic event when a locally monitored Kidde alarm changes
    its unmapped Bluetooth manufacturer payload. This is a protocol-research
    tool, not a smoke, CO, fault, or life-safety notification path.

    Redact device identifiers and location details before sharing captures.
  domain: automation
  source_url: https://github.com/trooperthorn/ha_int_kidde/blob/main/blueprints/automation/kidde_homesafe/ble_status_capture.yaml
  input:
    status_events:
      name: Status broadcast event entities
      description: The "Status broadcast" event entities of your Kidde alarms.
      selector:
        entity:
          filter:
            - domain: event
              integration: kidde_homesafe
          multiple: true
    notify_actions:
      name: Diagnostic capture actions (optional)
      description: >-
        Actions used to notify you. The variables `payload`,
        `previous_payload` and `source_entity` are available.
      default: []
      selector:
        action: {}
mode: queued
max: 25

triggers:
  - trigger: state
    entity_id: !input status_events

conditions:
  - condition: template
    value_template: "{{ trigger.to_state is not none and trigger.from_state is not none and trigger.to_state.state not in ('unknown', 'unavailable') }}"

variables:
  source_entity: "{{ trigger.entity_id }}"
  payload: "{{ trigger.to_state.attributes.get('payload') }}"
  previous_payload: "{{ trigger.to_state.attributes.get('previous_payload') }}"

actions:
  - action: persistent_notification.create
    data:
      title: "Unmapped Kidde BLE payload change"
      message: >-
        {{ source_entity }} broadcast payload {{ payload }}
        (was {{ previous_payload }}) at {{ now().isoformat() }}. This raw
        payload has no verified smoke, CO, or fault meaning.
  - sequence: !input notify_actions
